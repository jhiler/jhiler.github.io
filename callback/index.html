<!doctype html><meta charset="utf-8"><title>Tesla sign-in done</title>
<body style="font-family:sans-serif;max-width:40em;margin:3em auto">
<h2>Tesla sign-in complete</h2>
<p>Copy this code and paste it into the secure field in the Grok Bot chat. It expires in a few minutes.</p>
<input id="c" readonly style="width:100%;font-size:1.1em;padding:.5em">
<p><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copied'">Copy code</button></p>
<p id="e" style="color:#b00"></p>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||'';if(p.get('error'))document.getElementById('e').textContent='Error: '+p.get('error')+' '+(p.get('error_description')||'');</script>
</body>
